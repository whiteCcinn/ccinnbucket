name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: providers
    attributes:
      label: Storage services where you need it
      placeholder: "e.g. Amazon S3 and Alibaba Cloud OSS"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
